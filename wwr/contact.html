<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Get more information about this Company from here!">
    <meta name="author" content="Joel Seruntenda">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Contact Information</title>
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/logo.png" alt="Site Logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="contact">
            <div class="hero">

                <h1>White Water Rafting Company</h1>
                <div class="item"><strong class="box"></div>
                <div>Address:123 Main River Street </div>
                <div> Kolob, California</div>
                <div>+ 999 999 9999</div>
                <div>info@whitewater.com</div>
                </strong>

            </div>
        </section>
        <p></p>
        <form class="contact-form">
            <div class="form-row">
                <label>Name</label>
                <input type="text" name="name" id="name" placeholder="name">
            </div>

            <div class="form-row">
                <label>Email</label>
                <input type="text" name="email" id="email" placeholder="email">
            </div>
            <div contact-content>
                <div class="contact-form">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d31918.28178567215!2d32.59602220734609!3d0.23337620070040627!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x177d96720bc59193%3A0xda004873e09b155f!2sMunyonyo!5e0!3m2!1sen!2sug!4v1791032270281!5m2!1sen!2sug"></iframe>
                </div>
                <div class="radio-group">
                    <p>Message Purpose</p>
                    <label>
                        <input type="radio" name="purpose" value="general inquiry" id="radio">
                        General Inquiry
                    </label>
                </div>
                <p></p>

                <label>
                    <input type="radio" name="purpose" value="reservation question" id="radio">
                    Reservation Question
                </label>
                <p></p>

                <label>
                    <input type="radio" name="purpose" value="website suggestion" id="radio">
                    Website Suggestion
                </label>
                <p></p>

                <label>Message
                    <textarea name="text" id="message" rows="6"></textarea>
                </label>
            </div>

            <label>
                <input type="checkbox" name="newsletter">
                Please Subscribe me to the monthly newsletter
            </label>
            <p></p>

            <button type="submit">Get in touch!</button>

        </form>
        </div>
        <section class="employee-section">
            <h2>We are here to serve you</h2>
            <div class="employee-container">

                <div class="employee">
                    <img src="images/employe.jpg" alt="employee">
                    <p>Employee profile</p>
                </div>
                <div class="employee">
                    <img src="images/employi.jpg" alt="employee">
                    <p>Employee profile</p>
                </div>
                <div class="employee">
                    <img src="images/employee.jpg" alt="employee">
                    <p>Employee profile</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Jjuuko Joel</p>

        <nav class="socialmedia">
            <a href="#">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="#">
                <img src="images/instagram.png" alt="Instagram">
            </a>

            <a href="#">
                <img src="images/linkedin.png" alt="Linkedin">
            </a>
        </nav>
    </footer>
</body>

</html>
